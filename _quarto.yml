project:
  type: website
  resources:
    - filters.js
  output-dir: _site
  pre-render: sh scripts/prebuild.sh
  preview:
    port: 4200          # always http://localhost:4200/
    browser: false      # ./preview.sh opens the Home page; Quarto would otherwise pick a page itself
    navigate: false     # do not jump the browser to whichever page was just rebuilt

website:
  title: "Susan Thomas"
  site-url: "https://sthomas-econ.github.io/website/"
  navbar:
    right:
      - text: Home
        href: index.qmd
      - text: CV
        href: files/sue-res.pdf
      - text: Research
        href: research.qmd
      - text: Projects
        href: projects.qmd
      - text: Books
        href: books.qmd
      - text: Reading
        href: reading.qmd
  page-footer:
    left: "Susan Thomas"
    center: '<span id="cat-foot" class="cat-foot"></span>'
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/susan-thomas-417869/
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=0QRD90YAAAAJ&hl=en

from: markdown+hard_line_breaks

format:
  html:
    theme: cosmo
    css:
      - custom.css
      - palettes/sage-berry.css      # to change the look, swap in another file from palettes/
    toc: false
    include-before-body: files/includes/cat.html
    include-after-body: files/includes/cat-spots.html
