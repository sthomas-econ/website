name: Rebuild site

# Rebuilds the site into docs/ (the folder GitHub Pages serves) and commits it. Only this workflow writes docs/.
# Runs: whenever the source changes, on the 1st of every month, and from the "Run workflow" button.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
  schedule:
    - cron: "30 1 1 * *"   # the 1st of every month, 7:00 am India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y subversion
      - run: quarto render --output-dir docs   # the published site goes in docs/ (local previews use _site/)
      - name: Commit the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site"
            git pull --rebase
            git push
          fi
