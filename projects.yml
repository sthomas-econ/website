# Projects shown on the Projects page. Each one gets its own page (<name>.qmd).
#
# Selection is entirely by hand. Nothing is added automatically.
#
# include:  entries already on the Research or Books pages that belong to the project.
#           Write the exact title, or the web address. To drop an entry, delete its line.
#           To add one, copy its title from the Research or Books page.
# items:    things that are not on those pages (Datasets, Case studies, ...). Each needs a type and a title;
#           year (or date: "Mon YYYY"), url, authors, meta and abstract are optional. Example:
#
#   items:
#     - type: Dataset              # or: Case study (another type also needs a line in TYPES in filters.js)
#       title: "Name of the dataset"
#       date: "Mar 2026"
#       url: https://example.org/dataset
#       authors: Susan Thomas, Ajay Shah
#       meta: XKDR Data Portal
#       abstract: "One or two sentences."


